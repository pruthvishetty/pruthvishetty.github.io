em;font-size:0.75rem;color:var(--text-secondary);opacity:0.75;border-top:1px solid var(--border-color);background:var(--bg-secondary)}</style></head><body data-theme="light"><div class="header"><div class="logo-wrap"><a class="back-to-tools" href="tools.html" title="Back to all tools">← Tools</a><div class="logo"><i class="fas fa-qrcode"></i>

rm-input" id="phoneNumber" placeholder="+1234567890"></div></div><!-- SMS Input Form --><div id="sms-form" class="input-form" style="display: none;"><div class="form-group"><label class="form-label">Phone Number:</label><input type="tel" class="form-input" id="smsNumber" placeholder="+1234567890"></div><div class="form-group"><label class="form-label">Message:</label><textarea class="form-textarea" id="smsMessage" placeholder="SMS message..."></textarea></div></div></div><div class="advanced-options"><div class="collapsible" onclick="toggleAdvanced()"><i class="fas fa-chevron-down"></i>

      // Initialize privacy counter for QR Generator

          // Add counter button to header controls

          if (headerControls) {

                  headerControls.insertAdjacentHTML('beforeend', '<div id="qrcode-counter"></div>');
              }
          }
          
          // Initialize counter
