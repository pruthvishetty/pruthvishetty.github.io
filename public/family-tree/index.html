<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <meta name="theme-color" content="#f4ede0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Shetty Family</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&display=swap" rel="stylesheet" />
</head>
<body class="readonly-deploy">

  <!-- Gate screen — shown until the right password decrypts the data -->
  <div id="gate" class="gate" aria-live="polite">
    <div class="gate-card">
      <div class="gate-mark" aria-hidden="true"></div>
      <h1>Shetty Family</h1>
      <p class="gate-sub">Enter the family password to view the tree.</p>
      <form id="gate-form" autocomplete="off">
        <input id="gate-pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required />
        <button type="submit">Unlock</button>
      </form>
      <p id="gate-err" class="gate-err" hidden></p>
    </div>
  </div>

  <header class="topbar" hidden>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>Shetty</h1>
        <p class="subtitle" id="meta-line">Loading…</p>
      </div>
    </div>

    <div class="controls">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Find someone…" autocomplete="off" />
        <ul id="search-results" class="search-results" hidden></ul>
      </div>

      <div class="seg view-toggle" role="group" aria-label="View mode">
        <button id="view-tree" class="seg-btn active" data-view="tree" title="Whole family tree">Tree</button>
        <button id="view-relations" class="seg-btn" data-view="relations" title="One person's relationships">Relations</button>
      </div>

      <div class="seg" role="group" aria-label="View controls">
        <button id="reset-view" class="seg-btn" title="Re-center on patriarch">Re-center</button>
        <button id="expand-all" class="seg-btn" title="Expand every branch">Expand</button>
        <button id="collapse-all" class="seg-btn" title="Collapse to 2 generations">Collapse</button>
      </div>

      <button id="theme-toggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>

      <!-- Edit pill omitted — read-only deploy -->
    </div>
  </header>

  <main hidden>
    <div id="canvas-wrap">
      <svg id="tree" aria-label="Family tree"></svg>
      <div id="hint" class="hint">Drag to pan · Pinch / scroll to zoom · Tap a card to see details</div>

      <div id="kin-bar" class="kin-bar" hidden>
        <span class="kin-label">Show</span>
        <div class="kin-chips" role="group" aria-label="Kin layers"></div>
      </div>
    </div>
    <aside id="detail" class="detail closed" aria-hidden="true">
      <div class="detail-handle" aria-hidden="true"></div>
      <button class="close" id="detail-close" aria-label="Close panel">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div id="detail-body"></div>
    </aside>
  </main>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="close" id="modal-close" aria-label="Close">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <datalist id="known-places"></datalist>

  <footer class="footer" hidden>
    <span id="counts"></span>
  </footer>

  <script>
    // ───── Password-gated decryption of the data bundle ─────
    // The data is encrypted with AES-256-GCM, key = PBKDF2-SHA256(password, salt, 200k iters).
    // Without the password, the JSON is unreadable even if you download data.enc.json.
    const STORAGE_KEY = "ft.pw.ok";  // remember unlock per browser session

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveKey(password, salt, iterations) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function tryDecrypt(password) {
      const r = await fetch("./data.enc.json", { cache: "no-store" });
      if (!r.ok) throw new Error("Could not load data.");
      const blob = await r.json();
      const salt = b64ToBytes(blob.salt);
      const iv = b64ToBytes(blob.iv);
      const ct = b64ToBytes(blob.ct);
      const key = await deriveKey(password, salt, blob.iterations);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      const text = new TextDecoder().decode(pt);
      const data = JSON.parse(text);
      return data;
    }

    function showApp(data) {
      // Inject decrypted data where app.js expects it
      window.__SHETTY_DATA__ = data;
      document.getElementById("gate").remove();
      document.querySelector("header.topbar").hidden = false;
      document.querySelector("main").hidden = false;
      // Read-only deploy: hide the footer (it shows a "start server" hint we don't need)
      document.querySelector("footer.footer").hidden = true;
      // Now boot the app
      const s = document.createElement("script");
      s.src = "https://d3js.org/d3.v7.min.js";
      s.onload = () => {
        const a = document.createElement("script");
        a.src = "./assets/app.js";
        document.body.appendChild(a);
      };
      document.body.appendChild(s);
    }

    async function unlock(password) {
      const err = document.getElementById("gate-err");
      err.hidden = true;
      try {
        const data = await tryDecrypt(password);
        try { sessionStorage.setItem(STORAGE_KEY, password); } catch (_) {}
        showApp(data);
      } catch (e) {
        err.hidden = false;
        err.textContent = "Wrong password. Try again.";
        document.getElementById("gate-pw").focus();
        document.getElementById("gate-pw").select();
      }
    }

    document.getElementById("gate-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const pw = document.getElementById("gate-pw").value;
      unlock(pw);
    });

    // Auto-unlock if we already have the password this session
    (async () => {
      try {
        const remembered = sessionStorage.getItem(STORAGE_KEY);
        if (remembered) {
          const data = await tryDecrypt(remembered);
          showApp(data);
        }
      } catch (_) {
        // bad cached password — clear and stay on gate
        try { sessionStorage.removeItem(STORAGE_KEY); } catch (_) {}
      }
    })();
  </script>
</body>
</html>
