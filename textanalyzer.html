<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TextAnalyzer - Advanced Text Analysis Tool</title><link rel="icon" href="assets/images/favicon.ico" type="image/x-icon"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/tool-header-mobile.css"><style>:root{--bg-primary:#ffffff;--bg-secondary:#f8f9fa;--bg-tertiary:#e9ecef;--text-primary:#212529;--text-secondary:#6c757d;--border-color:#dee2e6;--accent-color:#007bff;--shadow:0 2px 10px rgba(0,0,0,.1)}[data-theme=dark]{--bg-primary:#1a1a1a;--bg-secondary:#2d2d2d;--bg-tertiary:#404040;--text-primary:#fff;--text-secondary:#b0b0b0;--border-color:#404040;--accent-color:#4dabf7}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Open Sans,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.75rem}.logo{display:flex;align-items:center;gap:.5rem;font-size:1.5rem;font-weight:600;color:var(--accent-color)}.header-controls{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}.btn{padding:.5rem 1rem;border:none;border-radius:6px;background:var(--accent-color);color:#fff;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:.5rem}.btn-secondary{background:var(--bg-tertiary);color:var(--text-primary)}.theme-toggle{background:var(--bg-tertiary);border:1px solid var(--border-color);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary)}.main-container{display:grid;grid-template-columns:1fr 350px;gap:2rem;padding:2rem;max-width:1400px;margin:0 auto}.panel-card{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:12px;overflow:hidden}.panel-header{padding:1rem 1.5rem;background:var(--bg-tertiary);border-bottom:1px solid var(--border-color);font-weight:600;font-size:.9rem;text-transform:uppercase;color:var(--text-secondary)}#textInput{width:100%;min-height:400px;border:none;outline:none;padding:1.5rem;font-family:JetBrains Mono,monospace;font-size:14px;line-height:1.6;background:var(--bg-primary);color:var(--text-primary);resize:vertical}.utility-bar{padding:1rem 1.5rem;background:var(--bg-tertiary);border-top:1px solid var(--border-color);display:flex;gap:.5rem;flex-wrap:wrap}.utility-btn{padding:.4rem .8rem;font-size:.8rem}.stats-panel{display:flex;flex-direction:column;gap:1rem}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.stat-card{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:1.5rem;text-align:center}.stat-number{font-size:2.5rem;font-weight:700;color:var(--accent-color);font-family:JetBrains Mono,monospace}.stat-label{font-size:.9rem;color:var(--text-secondary);margin-top:.5rem}.detailed-stats,.text-tools{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:12px;padding:1.5rem}.detailed-stats h3,.text-tools h3{margin-bottom:1rem}.stat-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border-color)}.stat-row:last-child{border-bottom:none}.stat-row-label{color:var(--text-secondary)}.stat-row-value{font-weight:600;font-family:JetBrains Mono,monospace}.reading-time{background:linear-gradient(135deg,#17a2b8,var(--accent-color));color:#fff;padding:1rem;border-radius:8px;text-align:center;margin-top:1rem}.reading-time-number{font-size:1.8rem;font-weight:700;font-family:JetBrains Mono,monospace}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.tool-btn{padding:.6rem;font-size:.8rem;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;cursor:pointer}.logo-wrap{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}.back-to-tools{display:inline-flex;align-items:center;gap:.35rem;color:var(--text-secondary);text-decoration:none;font-size:.85rem;font-weight:600;padding:.35rem .75rem;border-radius:6px;background:var(--bg-tertiary);border:1px solid var(--border-color)}.tools-footer{text-align:center;padding:.55rem 1rem;font-size:.75rem;color:var(--text-secondary);opacity:.75;border-top:1px solid var(--border-color);background:var(--bg-secondary)}@media (max-width:768px){body{overflow-x:hidden}.header{padding:.8rem 1rem}.header-controls{width:100%}.btn,.utility-btn{padding:.35rem .65rem;font-size:.8rem}.main-container{grid-template-columns:1fr;padding:1rem}#textInput{min-height:300px;font-size:16px}}</style></head><body data-theme="light"><div class="header"><div class="logo-wrap"><a class="back-to-tools" href="tools.html">← Tools</a><div class="logo"><i class="fas fa-chart-line"></i> TextAnalyzer</div></div><div class="header-controls"><button class="btn utility-btn" onclick="copyText()"><i class="fas fa-copy"></i> Copy Text</button><button class="btn utility-btn" onclick="clearText()"><i class="fas fa-trash"></i> Clear</button><button class="btn utility-btn" onclick="loadSample()"><i class="fas fa-file-import"></i> Sample</button><button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button></div></div><div class="main-container"><div class="text-panel"><div class="panel-card"><div class="panel-header"><i class="fas fa-edit"></i> Text Input</div><textarea id="textInput" placeholder="Start typing or paste your text here to analyze..." oninput="analyzeText()"></textarea><div class="utility-bar"><button class="btn utility-btn btn-secondary" onclick="formatText()">Format</button><button class="btn utility-btn btn-secondary" onclick="removeExtraSpaces()">Clean Spaces</button><button class="btn utility-btn btn-secondary" onclick="removeDuplicateLines()">Remove Duplicates</button></div></div></div><div class="stats-panel"><div class="stats-grid"><div class="stat-card"><div class="stat-number" id="wordCount">0</div><div class="stat-label">Words</div></div><div class="stat-card"><div class="stat-number" id="charCount">0</div><div class="stat-label">Characters</div></div><div class="stat-card"><div class="stat-number" id="charCountNoSpaces">0</div><div class="stat-label">Chars (no spaces)</div></div><div class="stat-card"><div class="stat-number" id="lineCount">0</div><div class="stat-label">Lines</div></div></div><div class="detailed-stats"><h3>Detailed Analysis</h3><div class="stat-row"><span class="stat-row-label">Paragraphs</span><span class="stat-row-value" id="paragraphCount">0</span></div><div class="stat-row"><span class="stat-row-label">Sentences</span><span class="stat-row-value" id="sentenceCount">0</span></div><div class="stat-row"><span class="stat-row-label">Average words/sentence</span><span class="stat-row-value" id="avgWordsPerSentence">0</span></div><div class="stat-row"><span class="stat-row-label">Average chars/word</span><span class="stat-row-value" id="avgCharsPerWord">0</span></div><div class="stat-row"><span class="stat-row-label">Longest word</span><span class="stat-row-value" id="longestWord">-</span></div><div class="stat-row"><span class="stat-row-label">Most frequent word</span><span class="stat-row-value" id="mostFrequentWord">-</span></div></div><div class="reading-time"><div class="reading-time-number" id="readingTime">0</div><div class="reading-time-label">min read</div></div><div class="text-tools"><h3>Text Tools</h3><div class="tool-grid"><button class="tool-btn" onclick="convertCase('upper')">UPPERCASE</button><button class="tool-btn" onclick="convertCase('lower')">lowercase</button><button class="tool-btn" onclick="convertCase('title')">Title Case</button><button class="tool-btn" onclick="convertCase('sentence')">Sentence case</button><button class="tool-btn" onclick="reverseText()">Reverse</button><button class="tool-btn" onclick="sortLines()">Sort Lines</button></div></div></div></div><script src="js/textanalyzer-app.js"></script><footer class="tools-footer">© 2026 Pruthvi Shetty</footer><script src="js/privacy-counter.js"></script><script data-goatcounter="https://pruthvishetty.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script><script>document.addEventListener("DOMContentLoaded",function(){var hc=document.querySelector(".header-controls");if(hc){var t=hc.querySelector(".theme-toggle");if(t)t.insertAdjacentHTML("beforebegin",'<div id="textanalyzer-counter"></div>');else hc.insertAdjacentHTML("beforeend",'<div id="textanalyzer-counter"></div>');}new PrivacyCounter("textanalyzer","textanalyzer-counter");});</script></body></html>
